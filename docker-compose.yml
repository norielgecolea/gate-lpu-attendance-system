services:

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tomcat:
    build:
      context: ./docker/tomcat
    image: lpu-attendance-tomcat:11-jdk21-ffmpeg
    container_name: tomcat_server
    ports:
      - "${TOMCAT_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-bHB1LWdhdGUtYXR0ZW5kYW5jZS1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzIQ==}
      APP_SYNC_API_KEY: ${APP_SYNC_API_KEY:-}
      APP_PICTURES_DIR: /usr/local/tomcat/pictures
      APP_VIDEOS_DIR: /usr/local/tomcat/videos
      TZ: Asia/Manila
      JAVA_OPTS: "-Dlpu.log.dir=/usr/local/tomcat/logs"
    volumes:
      # Deploy: mvn -f lpu-attendance-system clean package && cp lpu-attendance-system/target/attendance-system.war data/tomcat/webapps/
      - ./data/tomcat/webapps:/usr/local/tomcat/webapps
      - ./data/tomcat/logs:/usr/local/tomcat/logs
      - ./data/pictures:/usr/local/tomcat/pictures
      - ./data/videos:/usr/local/tomcat/videos
    depends_on:
      postgres:
        condition: service_healthy

  angular:
    image: node:24-alpine
    container_name: angular-app
    working_dir: /app
    volumes:
      - ./frontend:/app
      - angular_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      BACKEND_URL: http://tomcat:8080
      BACKEND_CONTEXT_PATH: /attendance-system
      HUSKY: "0"
      NG_ALLOWED_HOSTS: "*"
      NG_TRUST_PROXY_HEADERS: "X-FORWARDED-FOR,X-FORWARDED-PROTO,X-FORWARDED-HOST"
      PORT: "4200"
      HOST: "0.0.0.0"
    # Serve the production SSR build. Set FRONTEND_MODE=development to use ng serve.
    command: >
      sh -c "test -f package.json || { echo 'Missing package.json — mount ./frontend to /app'; exit 1; };
      if [ \"$${FRONTEND_MODE:-production}\" = development ]; then
        npm install && npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.js;
      else
        test -f dist/lpu-gate-attendance/server/server.mjs || { npm install && npx ng build; };
        PORT=4200 HOST=0.0.0.0 node dist/lpu-gate-attendance/server/server.mjs;
      fi"
    stdin_open: true
    tty: true
    depends_on:
      - tomcat

  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./data/web/templates:/etc/nginx/templates
    environment:
      NGINX_PORT: 80
      SERVER_NAME: localhost
      UPSTREAM_HOST: angular
      UPSTREAM_PORT: 4200
      TOMCAT_HOST: tomcat
      TOMCAT_PORT: 8080
    depends_on:
      - angular
      - tomcat

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./data/cloudflared:/etc/cloudflared
    depends_on:
      - web

volumes:
  angular_node_modules:

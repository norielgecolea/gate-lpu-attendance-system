x-tomcat: &tomcat
  build:
    context: ./docker/tomcat
  image: lpu-attendance-tomcat:11-jdk21-ffmpeg
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    APP_JWT_SECRET: ${APP_JWT_SECRET:-bHB1LWdhdGUtYXR0ZW5kYW5jZS1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzIQ==}
    APP_SYNC_API_KEY: ${APP_SYNC_API_KEY:-}
    APP_PICTURES_DIR: /usr/local/tomcat/pictures
    APP_VIDEOS_DIR: /usr/local/tomcat/videos
    APP_TONES_DIR: /usr/local/tomcat/tones
    APP_REDIS_ENABLED: "true"
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    TZ: Asia/Manila
    JAVA_OPTS: "-Xms256m -Xmx1024m -Dlpu.log.dir=/usr/local/tomcat/logs"
  mem_limit: 1536m
  volumes:
    # Deploy: mvn -f lpu-attendance-system clean package && cp lpu-attendance-system/target/attendance-system.war data/tomcat/webapps/
    - ./data/tomcat/webapps/attendance-system.war:/opt/deploy/attendance-system.war:ro
    - ./data/pictures:/usr/local/tomcat/pictures
    - ./data/videos:/usr/local/tomcat/videos
    - ./data/tones:/usr/local/tomcat/tones
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/attendance-system/api/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 90s
  networks:
    default:
      aliases:
        - tomcat

services:

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tomcat-1:
    <<: *tomcat
    hostname: tomcat-1
    ports:
      - "${TOMCAT_PORT:-8080}:8080"

  tomcat-2:
    <<: *tomcat
    hostname: tomcat-2

  angular:
    image: node:24-alpine
    container_name: angular-app
    working_dir: /app
    volumes:
      - ./frontend:/app
      - angular_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      BACKEND_URL: http://tomcat:8080
      BACKEND_CONTEXT_PATH: /attendance-system
      HUSKY: "0"
      # production = SSR from dist (nginx on :80 proxies /attendance-system to Tomcat).
      # development = ng serve with proxy.conf.js so localhost:4200 can log in.
      FRONTEND_MODE: ${FRONTEND_MODE:-production}
      NG_ALLOWED_HOSTS: "attendance.norielgecolea.com,attendance.lpulaguna.com,attendancev2.lpu-laguna.edu.ph,localhost,127.0.0.1,angular"
      NG_TRUST_PROXY_HEADERS: "X-FORWARDED-FOR,X-FORWARDED-PROTO,X-FORWARDED-HOST"
      PORT: "4200"
      HOST: "0.0.0.0"
    # Serve the production SSR build. Set FRONTEND_MODE=development for ng serve.
    command: >
      sh -c "test -f package.json || { echo 'Missing package.json — mount ./frontend to /app'; exit 1; };
      if [ \"$${FRONTEND_MODE:-production}\" = development ]; then
        test -x node_modules/.bin/ng || npm install;
        npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.js;
      else
        test -f dist/lpu-gate-attendance/server/server.mjs || { npm install && npx ng build; };
        PORT=4200 HOST=0.0.0.0 node dist/lpu-gate-attendance/server/server.mjs;
      fi"
    stdin_open: true
    tty: true
    depends_on:
      tomcat-1:
        condition: service_healthy
      tomcat-2:
        condition: service_healthy

  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./data/web/templates:/etc/nginx/templates
    environment:
      NGINX_PORT: 80
      SERVER_NAME: ${SERVER_NAME:-attendance.norielgecolea.com attendance.lpulaguna.com attendancev2.lpu-laguna.edu.ph localhost}
      UPSTREAM_HOST: angular
      UPSTREAM_PORT: 4200
    depends_on:
      - angular
      - tomcat-1
      - tomcat-2

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./data/cloudflared:/etc/cloudflared
    depends_on:
      - web

volumes:
  angular_node_modules:

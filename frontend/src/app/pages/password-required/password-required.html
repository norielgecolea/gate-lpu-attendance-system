<div class="flex min-h-dvh items-center justify-center bg-[#f6f7fb] p-4">
  <form
    class="flex w-full max-w-md flex-col gap-5 rounded-3xl bg-white p-8 shadow-xl ring-1 ring-zinc-950/10"
    (ngSubmit)="submit()"
    novalidate
  >
    <header class="flex flex-col gap-2">
      <p class="text-primary text-sm font-bold uppercase tracking-[0.18em]">Password update</p>
      <h1 class="text-2xl font-black text-gray-950">Choose a new password</h1>
      <p class="text-sm leading-relaxed text-gray-600">
        {{ username }} is still using a password that was published with the system. Set a new one
        before continuing.
      </p>
    </header>

    <label class="flex flex-col gap-1.5 text-sm font-semibold text-gray-800">
      Current password
      <input
        type="password"
        name="currentPassword"
        autocomplete="current-password"
        class="rounded-lg border border-zinc-950/15 px-3 py-2.5 font-normal"
        [(ngModel)]="currentPassword"
        [disabled]="saving()"
      />
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-semibold text-gray-800">
      New password
      <input
        type="password"
        name="newPassword"
        autocomplete="new-password"
        class="rounded-lg border border-zinc-950/15 px-3 py-2.5 font-normal"
        [(ngModel)]="newPassword"
        [disabled]="saving()"
      />
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-semibold text-gray-800">
      Confirm new password
      <input
        type="password"
        name="confirmPassword"
        autocomplete="new-password"
        class="rounded-lg border border-zinc-950/15 px-3 py-2.5 font-normal"
        [(ngModel)]="confirmPassword"
        [disabled]="saving()"
      />
    </label>

    @if (error()) {
      <p class="rounded-lg border border-red-100 bg-red-50 px-3 py-2 text-sm font-medium text-red-600" role="alert">
        {{ error() }}
      </p>
    }

    <button
      type="submit"
      class="bg-primary rounded-lg px-4 py-3 text-sm font-semibold text-white disabled:opacity-50"
      [disabled]="saving()"
    >
      {{ saving() ? 'Saving...' : 'Update password' }}
    </button>
  </form>
</div>

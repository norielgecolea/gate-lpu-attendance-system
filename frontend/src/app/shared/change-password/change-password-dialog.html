<div class="flex max-h-[85vh] flex-col gap-4 overflow-y-auto p-1">
  <div hlmDialogHeader>
    <h2 hlmDialogTitle>Change password</h2>
    <p hlmDialogDescription>
      Update the password for {{ username }}. You will stay signed in after saving.
    </p>
  </div>

  <form hlmFieldGroup class="gap-4" (ngSubmit)="submit()">
    @if (error()) {
      <p class="bg-destructive/10 text-destructive rounded-md px-3 py-2 text-sm" role="alert">
        {{ error() }}
      </p>
    }

    <div hlmField>
      <label hlmFieldLabel for="current-password">Current password</label>
      <div class="relative">
        <input
          hlmInput
          id="current-password"
          name="currentPassword"
          class="pr-9"
          [type]="showCurrent() ? 'text' : 'password'"
          [(ngModel)]="currentPassword"
          autocomplete="current-password"
          [disabled]="saving()"
        />
        <button
          type="button"
          class="text-muted-foreground hover:text-foreground absolute inset-y-0 right-0 flex items-center px-2"
          [attr.aria-label]="showCurrent() ? 'Hide current password' : 'Show current password'"
          [attr.aria-pressed]="showCurrent()"
          (click)="showCurrent.set(!showCurrent())"
        >
          <ng-icon [name]="showCurrent() ? 'lucideEyeOff' : 'lucideEye'" class="text-base" />
        </button>
      </div>
    </div>

    <div hlmField>
      <label hlmFieldLabel for="new-password">New password</label>
      <div class="relative">
        <input
          hlmInput
          id="new-password"
          name="newPassword"
          class="pr-9"
          [type]="showNew() ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          [disabled]="saving()"
        />
        <button
          type="button"
          class="text-muted-foreground hover:text-foreground absolute inset-y-0 right-0 flex items-center px-2"
          [attr.aria-label]="showNew() ? 'Hide new password' : 'Show new password'"
          [attr.aria-pressed]="showNew()"
          (click)="showNew.set(!showNew())"
        >
          <ng-icon [name]="showNew() ? 'lucideEyeOff' : 'lucideEye'" class="text-base" />
        </button>
      </div>
    </div>

    <div hlmField>
      <label hlmFieldLabel for="confirm-password">Confirm new password</label>
      <input
        hlmInput
        id="confirm-password"
        name="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
        [disabled]="saving()"
      />
    </div>

    <div hlmDialogFooter class="gap-2">
      <button hlmBtn type="button" variant="outline" [disabled]="saving()" (click)="cancel()">
        Cancel
      </button>
      <button hlmBtn type="submit" [disabled]="saving()">
        {{ saving() ? 'Saving…' : 'Update password' }}
      </button>
    </div>
  </form>
</div>
